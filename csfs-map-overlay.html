<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>EarthSteward — Infestation Map</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #0e1410; font-family: 'Inter', system-ui, sans-serif; overflow-x: hidden; }
  body { display: flex; justify-content: center; align-items: flex-start; padding: 20px 0; min-height: 100vh; }

  /* ── Mobile shell ──────────────────────────────────────────────────────── */
  .shell {
    width: 393px;
    height: 852px;
    margin: 0 auto;
    position: relative;
    overflow: hidden;
    border-radius: 44px;
    box-shadow: 0 32px 80px rgba(0,0,0,0.6);
    background: #0e1410;
    flex-shrink: 0;
  }

  /* ── Nav Top ─────────────────────────────────────────────────────────────*/
  .nav-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 52px;
    background: #1e2d22;
    border-bottom: 0.5px solid rgba(45,122,79,0.3);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    z-index: 20;
  }
  .nav-back {
    color: #3a9e66;
    font-size: 13px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
  }
  .nav-title {
    color: #b8ccc3;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .nav-right { width: 60px; text-align: right; }

  /* ── Map ──────────────────────────────────────────────────────────────── */
  #map {
    position: absolute;
    top: 52px; left: 0; right: 0; bottom: 64px;
  }

  /* ── Map icon buttons (layers + pencil) ─────────────────────────────────*/
  .map-icons {
    position: absolute;
    top: 68px;
    right: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 10;
  }
  .map-icon-btn {
    width: 36px;
    height: 36px;
    background: #1e2d22;
    border: 0.5px solid rgba(45,122,79,0.5);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s;
  }
  .map-icon-btn:active, .map-icon-btn.active {
    background: #2d7a4f;
  }
  .map-icon-btn svg { width: 20px; height: 20px; fill: #b8ccc3; }
  .map-icon-btn.active svg { fill: #fff; }

  /* ── Parcel info bar ────────────────────────────────────────────────────*/
  .parcel-bar {
    position: absolute;
    bottom: 80px;
    left: 12px;
    right: 12px;
    background: #1e2d22;
    border: 0.5px solid rgba(45,122,79,0.4);
    border-radius: 10px;
    padding: 10px 14px;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .parcel-label { color: #8a9e94; font-size: 11px; }
  .parcel-value { color: #e8f0eb; font-size: 13px; font-weight: 600; }
  .parcel-meta { text-align: right; }

  /* ── Legend ──────────────────────────────────────────────────────────── */
  .legend {
    position: absolute;
    bottom: 152px;
    left: 12px;
    background: rgba(14,20,16,0.88);
    border: 0.5px solid rgba(45,122,79,0.3);
    border-radius: 8px;
    padding: 8px 12px;
    z-index: 10;
    backdrop-filter: blur(8px);
  }
  .legend-title {
    color: #8a9e94;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
  }
  .legend-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  .legend-swatch {
    width: 14px;
    height: 10px;
    border-radius: 2px;
    flex-shrink: 0;
  }
  .legend-row span {
    color: #b8ccc3;
    font-size: 11px;
  }

  /* ── Infestation popup ──────────────────────────────────────────────── */
  .mapboxgl-popup-content {
    background: #1e2d22 !important;
    border: 0.5px solid rgba(45,122,79,0.5) !important;
    border-radius: 10px !important;
    padding: 12px 14px !important;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4) !important;
    min-width: 180px;
  }
  .mapboxgl-popup-tip {
    border-top-color: #1e2d22 !important;
  }
  .popup-species {
    color: #e8f0eb;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .popup-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 3px;
  }
  .popup-label { color: #8a9e94; font-size: 11px; }
  .popup-val   { color: #b8ccc3; font-size: 11px; font-weight: 500; }
  .popup-sev {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 99px;
    font-size: 10px;
    font-weight: 600;
    margin-top: 6px;
  }

  /* ── Loading state ───────────────────────────────────────────────────── */
  .loading-badge {
    position: absolute;
    top: 64px;
    left: 12px;
    background: rgba(14,20,16,0.9);
    border: 0.5px solid rgba(45,122,79,0.4);
    border-radius: 8px;
    padding: 6px 12px;
    color: #8a9e94;
    font-size: 11px;
    z-index: 15;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .spinner {
    width: 12px;
    height: 12px;
    border: 1.5px solid rgba(58,158,102,0.3);
    border-top-color: #3a9e66;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Nav Bottom ──────────────────────────────────────────────────────── */
  .nav-bottom {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 64px;
    background: #1e2d22;
    border-top: 0.5px solid rgba(45,122,79,0.3);
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 0 8px;
    z-index: 20;
  }
  .nav-tab {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    flex: 1;
    cursor: pointer;
    padding: 8px 0;
  }
  .nav-tab svg { width: 22px; height: 22px; fill: #8a9e94; }
  .nav-tab.active svg { fill: #3a9e66; }
  .nav-tab span { font-size: 10px; color: #8a9e94; }
  .nav-tab.active span { color: #3a9e66; }

  /* ── Status badge (Detect screen prompt) ─────────────────────────────── */
  .detect-prompt {
    position: absolute;
    bottom: 80px;
    left: 0; right: 0;
    display: flex;
    justify-content: center;
    z-index: 10;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .detect-prompt.visible { opacity: 1; pointer-events: all; }
  .detect-pill {
    background: #2d7a4f;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 24px;
    border-radius: 99px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(45,122,79,0.4);
  }
</style>
</head>
<body>
<div class="shell">

  <!-- Nav Top -->
  <div class="nav-top">
    <div class="nav-back">
      <svg width="8" height="13" viewBox="0 0 8 13" fill="none"><path d="M7 1L1 6.5L7 12" stroke="#3a9e66" stroke-width="1.5" stroke-linecap="round"/></svg>
      Locate
    </div>
    <div class="nav-title">Forest Health</div>
    <div class="nav-right"></div>
  </div>

  <!-- Map -->
  <div id="map"></div>

  <!-- Loading -->
  <div class="loading-badge" id="loadingBadge">
    <div class="spinner"></div>
    Loading survey data…
  </div>

  <!-- Map icon buttons -->
  <div class="map-icons">
    <!-- Layers toggle -->
    <div class="map-icon-btn active" id="layersBtn" title="Toggle infestation overlay">
      <svg viewBox="0 0 24 24"><path d="M11.99 18.54l-7.37-5.73L3 14.07l9 7 9-7-1.63-1.27-7.38 5.74zm.01-2.77l7.36-5.73L21 8.77l-9-7-9 7 1.63 1.27L12 15.77z"/></svg>
    </div>
    <!-- Draw/pencil -->
    <div class="map-icon-btn" id="drawBtn" title="Draw parcel boundary">
      <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
    </div>
  </div>

  <!-- Legend -->
  <div class="legend">
    <div class="legend-title">Infestation Severity</div>
    <div class="legend-row"><div class="legend-swatch" style="background:#e74c3c;"></div><span>Severe</span></div>
    <div class="legend-row"><div class="legend-swatch" style="background:#e67e22;"></div><span>Moderate</span></div>
    <div class="legend-row"><div class="legend-swatch" style="background:#d4e52c;"></div><span>Light</span></div>
    <div class="legend-row"><div class="legend-swatch" style="background:rgba(45,122,79,0.6);"></div><span>Survey area</span></div>
  </div>

  <!-- Parcel info bar -->
  <div class="parcel-bar">
    <div>
      <div class="parcel-label">Location</div>
      <div class="parcel-value">Park County, CO</div>
    </div>
    <div class="parcel-meta">
      <div class="parcel-label">Montane Zone</div>
      <div class="parcel-value">8,000–11,500 ft</div>
    </div>
  </div>

  <!-- Nav Bottom -->
  <div class="nav-bottom">
    <div class="nav-tab">
      <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
      <span>Locate</span>
    </div>
    <div class="nav-tab active">
      <svg viewBox="0 0 24 24"><path d="M9.5 6.5v3h-3v-3h3M11 5H5v6h6V5zm-1.5 9.5v3h-3v-3h3M11 13H5v6h6v-6zm6.5-6.5v3h-3v-3h3M19 5h-6v6h6V5zm-6 8h1.5v1.5H13V13zm1.5 1.5H16V16h-1.5v-1.5zM16 13h1.5v1.5H16V13zm-3 3h1.5v1.5H13V16zm1.5 1.5H16V19h-1.5v-1.5zM16 16h1.5v1.5H16V16zm1.5-1.5H19V16h-1.5v-1.5zm0 3H19V19h-1.5v-1.5zM22 7h-2V4h-3V2h5v5zm0 15v-5h-2v3h-3v2h5zM2 22h5v-2H4v-3H2v5zM2 2v5h2V4h3V2H2z"/></svg>
      <span>Detect</span>
    </div>
    <div class="nav-tab">
      <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
      <span>Apply</span>
    </div>
    <div class="nav-tab">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <span>Profile</span>
    </div>
  </div>

</div>

<script>
// ── Mapbox token (replace with your token) ────────────────────────────────────
mapboxgl.accessToken = 'pk.eyJ1IjoiaWFtZGVzaWducyIsImEiOiJja2VrdDA4MnMwNDg1MnNscWgxZXZwbHNxIn0.HDZu1QxGhTfi3fC9uZanyA';

// Park County, Colorado center
const PARK_COUNTY_CENTER = [-105.45, 39.35];
const PARK_COUNTY_ZOOM   = 9.5;

// ── USFS ADS query endpoint (public — no auth required) ───────────────────────
// Enterprise Data Warehouse: Insect & Disease Survey Damage Types
// Filtered to Colorado + Park County bounding box + last 3 survey years
const PARK_CO_BBOX = '-106.1,38.9,-104.9,39.75';
const ADS_URL = [
  'https://apps.fs.usda.gov/ArcX/rest/services/EDW/EDW_IDSurveyDamageTypes_01/MapServer/0/query',
  '?where=STATE_ABBR%3D%27CO%27',
  '&geometry=' + encodeURIComponent(PARK_CO_BBOX),
  '&geometryType=esriGeometryEnvelope',
  '&inSR=4326',
  '&spatialRel=esriSpatialRelIntersects',
  '&outFields=DCA_CODE,DCA_COMMON_NAME,SURVEY_YEAR,GIS_ACRES,PERCENT_AFFECTED,SEVERITY_CLASS',
  '&outSR=4326',
  '&returnGeometry=true',
  '&f=geojson'
].join('');

// ── Severity → colour mapping ─────────────────────────────────────────────────
const SEV_COLORS = {
  'High':   '#e74c3c',   // red   — severe
  'Medium': '#e67e22',   // amber — moderate
  'Low':    '#d4e52c',   // yellow-green — light
  'default':'rgba(45,122,79,0.6)',
};

function sevColor(props) {
  const s = (props.SEVERITY_CLASS || props.PERCENT_AFFECTED || '').toString();
  if (/high|severe|3/i.test(s))   return SEV_COLORS.High;
  if (/med|moderate|2/i.test(s))  return SEV_COLORS.Medium;
  if (/low|light|1/i.test(s))     return SEV_COLORS.Low;
  return SEV_COLORS.default;
}

function sevLabel(props) {
  const s = (props.SEVERITY_CLASS || props.PERCENT_AFFECTED || '').toString();
  if (/high|severe|3/i.test(s))   return ['Severe',   '#e74c3c', '#fff'];
  if (/med|moderate|2/i.test(s))  return ['Moderate', '#e67e22', '#fff'];
  if (/low|light|1/i.test(s))     return ['Light',    '#d4e52c', '#0f1a14'];
  return ['Unknown', '#2d7a4f', '#fff'];
}

// ── Fallback: Park County sample data (used if CORS blocks live fetch) ────────
// Based on CSFS 2024 report: MPB 480 ac, W Spruce Budworm active, DF Beetle present
const FALLBACK_GEOJSON = {
  type: 'FeatureCollection',
  features: [
    {
      type: 'Feature',
      properties: {
        DCA_COMMON_NAME: 'Mountain Pine Beetle',
        SURVEY_YEAR: 2024, GIS_ACRES: 480, SEVERITY_CLASS: 'High',
      },
      geometry: {
        type: 'Polygon',
        coordinates: [[
          [-105.6, 39.45], [-105.5, 39.45], [-105.5, 39.55],
          [-105.6, 39.55], [-105.6, 39.45]
        ]]
      }
    },
    {
      type: 'Feature',
      properties: {
        DCA_COMMON_NAME: 'Western Spruce Budworm',
        SURVEY_YEAR: 2024, GIS_ACRES: 1240, SEVERITY_CLASS: 'Medium',
      },
      geometry: {
        type: 'Polygon',
        coordinates: [[
          [-105.35, 39.2], [-105.15, 39.2], [-105.15, 39.4],
          [-105.35, 39.4], [-105.35, 39.2]
        ]]
      }
    },
    {
      type: 'Feature',
      properties: {
        DCA_COMMON_NAME: 'Douglas-fir Beetle',
        SURVEY_YEAR: 2024, GIS_ACRES: 320, SEVERITY_CLASS: 'Low',
      },
      geometry: {
        type: 'Polygon',
        coordinates: [[
          [-105.7, 39.1], [-105.55, 39.1], [-105.55, 39.25],
          [-105.7, 39.25], [-105.7, 39.1]
        ]]
      }
    },
    {
      type: 'Feature',
      properties: {
        DCA_COMMON_NAME: 'Spruce Beetle',
        SURVEY_YEAR: 2023, GIS_ACRES: 890, SEVERITY_CLASS: 'High',
      },
      geometry: {
        type: 'Polygon',
        coordinates: [[
          [-105.8, 39.3], [-105.65, 39.3], [-105.65, 39.5],
          [-105.8, 39.5], [-105.8, 39.3]
        ]]
      }
    },
    {
      type: 'Feature',
      properties: {
        DCA_COMMON_NAME: 'Mountain Pine Beetle',
        SURVEY_YEAR: 2023, GIS_ACRES: 180, SEVERITY_CLASS: 'Medium',
      },
      geometry: {
        type: 'Polygon',
        coordinates: [[
          [-105.2, 39.5], [-105.05, 39.5], [-105.05, 39.65],
          [-105.2, 39.65], [-105.2, 39.5]
        ]]
      }
    },
  ]
};

// ── Map init ──────────────────────────────────────────────────────────────────
const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/dark-v11',
  center: PARK_COUNTY_CENTER,
  zoom: PARK_COUNTY_ZOOM,
  attributionControl: false,
  logoPosition: 'bottom-right',
});

map.addControl(new mapboxgl.AttributionControl({ compact: true }), 'bottom-right');

let overlayVisible = true;
let activePopup = null;

// ── Load data and add layers ──────────────────────────────────────────────────
map.on('load', async () => {

  let geojson = null;

  // Try live fetch first
  try {
    const res = await fetch(ADS_URL, { mode: 'cors' });
    if (res.ok) {
      geojson = await res.json();
      if (!geojson.features || geojson.features.length === 0) throw new Error('empty');
      console.log(`[EarthSteward] Loaded ${geojson.features.length} ADS features from USFS EDW`);
    } else {
      throw new Error('HTTP ' + res.status);
    }
  } catch(e) {
    console.warn('[EarthSteward] Live fetch failed, using fallback data:', e.message);
    geojson = FALLBACK_GEOJSON;
  }

  // Hide loading badge
  document.getElementById('loadingBadge').style.display = 'none';

  // Assign color property to each feature
  geojson.features.forEach(f => {
    f.properties._color  = sevColor(f.properties);
  });

  // Add source
  map.addSource('csfs-ads', {
    type: 'geojson',
    data: geojson,
  });

  // Fill layer — colored by severity
  map.addLayer({
    id: 'csfs-ads-fill',
    type: 'fill',
    source: 'csfs-ads',
    paint: {
      'fill-color': ['get', '_color'],
      'fill-opacity': 0.45,
    },
  });

  // Outline layer
  map.addLayer({
    id: 'csfs-ads-outline',
    type: 'line',
    source: 'csfs-ads',
    paint: {
      'line-color': ['get', '_color'],
      'line-width': 1.2,
      'line-opacity': 0.8,
    },
  });

  // ── Tap/click popup ─────────────────────────────────────────────────────
  map.on('click', 'csfs-ads-fill', (e) => {
    if (activePopup) { activePopup.remove(); activePopup = null; }

    const props = e.features[0].properties;
    const [sevText, sevBg, sevTxt] = sevLabel(props);
    const species  = props.DCA_COMMON_NAME || props.DCA_CODE || 'Unknown species';
    const acres    = props.GIS_ACRES ? Math.round(props.GIS_ACRES).toLocaleString() : '—';
    const year     = props.SURVEY_YEAR || '—';

    const html = `
      <div class="popup-species">${species}</div>
      <div class="popup-row">
        <span class="popup-label">Acres affected</span>
        <span class="popup-val">${acres} ac</span>
      </div>
      <div class="popup-row">
        <span class="popup-label">Survey year</span>
        <span class="popup-val">${year}</span>
      </div>
      <div>
        <span class="popup-sev" style="background:${sevBg};color:${sevTxt}">${sevText}</span>
      </div>
    `;

    activePopup = new mapboxgl.Popup({ closeButton: false, maxWidth: '220px' })
      .setLngLat(e.lngLat)
      .setHTML(html)
      .addTo(map);
  });

  // Dismiss popup on map click outside polygon
  map.on('click', (e) => {
    const features = map.queryRenderedFeatures(e.point, { layers: ['csfs-ads-fill'] });
    if (features.length === 0 && activePopup) {
      activePopup.remove();
      activePopup = null;
    }
  });

  // Cursor
  map.on('mouseenter', 'csfs-ads-fill', () => map.getCanvas().style.cursor = 'pointer');
  map.on('mouseleave', 'csfs-ads-fill', () => map.getCanvas().style.cursor = '');
});

// ── Layers toggle button ──────────────────────────────────────────────────────
document.getElementById('layersBtn').addEventListener('click', () => {
  overlayVisible = !overlayVisible;
  const vis = overlayVisible ? 'visible' : 'none';
  if (map.getLayer('csfs-ads-fill'))    map.setLayoutProperty('csfs-ads-fill',    'visibility', vis);
  if (map.getLayer('csfs-ads-outline')) map.setLayoutProperty('csfs-ads-outline', 'visibility', vis);
  document.getElementById('layersBtn').classList.toggle('active', overlayVisible);
});

// ── Draw mode toggle ──────────────────────────────────────────────────────────
document.getElementById('drawBtn').addEventListener('click', () => {
  document.getElementById('drawBtn').classList.toggle('active');
  // Parcel draw mode: hook Mapbox Draw here in dev build
  // mapboxDrawInstance.changeMode('draw_polygon');
});
</script>

</body>
</html>
